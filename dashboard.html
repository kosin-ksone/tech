<style>

@media(max-width:640px){.rec{grid-template-columns:1fr}.rec .act{flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}.reason{text-align:left}}

</style></head><body>

<script>
/* ===== Dashboard ENDO (ตัวอย่าง) — ข้อมูลสมมติ สร้างจากรายชื่อช่าง + เขตจริง ===== */
const PASS='endo1234', KEY='endo_dash_demo_v2';
const TASKS=[['A1','ทดลองใช้จริง ก่อนสอบราคา',8],['A7','follow up ลูกค้าที่ซื้อแล้ว',8],['B1','ติดตั้งเครื่องมือเต็มชุด (จอ+แก๊ส+น้ำ)',4],['B4','เคสนอกเวลา / วันหยุด',10],
  ['C1','ตรวจเช็คเครื่องมือ (Instruments)',2],['C2','ตรวจเช็ค UNIT',4],['D2','Present นำเสนอเฉย ๆ',8],['E2','ส่งมอบ+ติดตั้ง ไม่ demo',14],['E3','ส่งมอบ+ติดตั้ง+demo',21],['E4','สอนการใช้งานเครื่องมือ',10],
  ['F2','นำส่งเครื่องมือเพื่อทดลองใช้',2],['F4','รับเครื่องมือกลับมาตรวจเช็ค',2],['G1','Maintenance เครื่องมือ',5],['H4','วางบิล',5],['J1','เช็คเครื่องมือระบบ OR1 ในห้องผ่าตัด',10],['J4','เครื่องสลายนิ่ว ตรวจเช็ค',10],['K1','งานอื่นๆ',0]];
const DESC=['เช็คกล้อง + ทำความสะอาด ใช้งานปกติ','เปลี่ยนสายไฟเบอร์ ทดสอบภาพชัด','ลูกค้าขอเพิ่มเลนส์ 30°','ติดตั้งจอ 4K + light source','สอนพยาบาลห้องผ่าตัด 6 คน','ตรวจรอยรั่ว ผ่าน','รับกล้องกลับมาซ่อม หน้าเลนส์มัว',''];
const PROB=['','','','','รอใบ maintenance ลูกค้าเซ็น','ลูกค้าแจ้งภาพกระพริบเป็นช่วงๆ','อะไหล่ยังไม่มา นัดเข้าใหม่สัปดาห์หน้า'];
const PAR=['นนทบุรี','ปทุมธานี','สมุทรปราการ','สมุทรสาคร','นครปฐม'];
const DOW=['อา','จ','อ','พ','พฤ','ศ','ส'], DOWF=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'], MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],
  MONF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'), kd=k=>new Date(k+'T00:00:00');
const addD=(k,n)=>{const d=kd(k);d.setDate(d.getDate()+n);return dk(d);}, monOf=k=>{const d=kd(k);d.setDate(d.getDate()-d.getDay());return dk(d);};   // สัปดาห์ช่าง: อาทิตย์–เสาร์
const thD=k=>{const d=kd(k);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];};
const TECHS=(window.TECHNICIANS||[]).filter(t=>t.status!=='pending');
const isBkk=t=>(t.region||'กทม./ปริมณฑล')!=='ต่างจังหวัด';
const nick=t=>t.nick||t.name.split(' ')[0];
const isOffice=h=>/^\s*(ออฟฟิศ|ออฟฟิส|บริษัท|สำนักงาน|office|kosin)/i.test(String(h||''));   // เข้าออฟฟิศ = ไม่คิดค่าจุด (พี่ฝน 29 ต.ค. 69)
const PD_AMT=250;   // เบี้ยเลี้ยง ช่าง กทม. ไป ตจว. ต่อวัน (เท่าช่าง ตจว. · พี่ฝน 29 ต.ค. 69)
const HN=s=>String(s||'').toLowerCase().replace(/โรงพยาบาล|รพ\.?|\s|\.|-|\(|\)/g,'');
const H_ALIAS={'medpark':'โรงพยาบาลเมดพาร์ค','medparkhospital':'โรงพยาบาลเมดพาร์ค'};
let ZN=null;function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++;}}return d+(a.length-i)+(b.length-j)<=1;}
function zoneOf(h){const Z=window.ZONE_INFO||{};if(Z[h])return Object.assign({name:h},Z[h]);
  if(!ZN){ZN={};Object.keys(Z).forEach(k=>{ZN[HN(k)]=k;});}
  const n=HN(h);if(!n)return null;const k=ZN[n]||H_ALIAS[n];if(k&&Z[k])return Object.assign({name:k,fuzzy:true},Z[k]);
  if(n.length>=4){const c=Object.keys(ZN).filter(x=>lev1(n,x));if(c.length===1)return Object.assign({name:ZN[c[0]],fuzzy:true},Z[ZN[c[0]]]);}   // พิมพ์ผิด 1 ตัว เช่น ราขวิถี → ราชวิถี
  return null;}
const pv=a=>(a==='กทม.'||a==='กทม')?'กทม':a;
// ประเภทของรายงาน 1 ใบ (ช่าง กทม.): off=ออฟฟิศ · pt=ค่าจุด(rate) · pd=เบี้ยเลี้ยง ตจว. · unk=ไม่รู้เขต รอตรวจ
function classify(r){if(isOffice(r.hospital))return{k:'off'};const z=zoneOf(r.hospital);let p=z?z.p:null;
  if(!p&&/^(เบี้ยเลี้ยง|ค่าจุด \(รอพิจารณา\)|ฐาน)/.test(r.allow||'')&&r.area)p=pv(r.area);   // ชื่อพิมพ์เอง แต่แอปรู้จังหวัด
  if(!p)return{k:'unk'};if(p==='กทม')return{k:'pt',rate:75,z:z};if(PAR.indexOf(p)>=0)return{k:'pt',rate:100,z:z};return{k:'pd',prov:p==='ต่างจังหวัด'?'ต่างจังหวัด':p,z:z};}
function rateOf(h){const c=classify({hospital:h});return c.k==='pt'?c.rate:0;}
function photo(label,hue){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+hue+',45%,72%)"/><stop offset="1" stop-color="hsl('+((hue+40)%360)+',40%,90%)"/></linearGradient></defs><rect width="240" height="180" fill="url(#g)"/><text x="120" y="98" font-family="Tahoma" font-size="20" text-anchor="middle" fill="rgba(0,0,0,.55)">'+label+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
// ข้อมูลตัวอย่าง (สุ่มแบบคงที่)
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};const pick=a=>a[Math.floor(rnd()*a.length)];
const TODAY=dk(new Date());
function buildDemo(){
  const recs=[];const allH=Object.keys(window.ZONE_INFO||{});
  const start=dk(new Date(new Date().getFullYear(),new Date().getMonth()-1,1));
  TECHS.forEach((t,ti)=>{const hs=((window.ZONE_TECH||{})[t.name]||[]).length?(window.ZONE_TECH[t.name]):allH.slice(ti*20,ti*20+20);
    for(let k=start;k<=TODAY;k=addD(k,1)){const d=kd(k).getDay();if(d===0||(d===6&&rnd()<.85))continue;if(rnd()<.12)continue;
      const nP=rnd()<.35?2:1;for(let p=0;p<nP;p++){const h=pick(hs);const nT=rnd()<.3?2:1;
        for(let j=0;j<nT;j++){const T=pick(TASKS);const age=(kd(TODAY)-kd(k))/864e5;
          let st=age>6?(rnd()<.92?'ผ่าน':'ไม่ผ่าน'):(age>2?(rnd()<.55?'ผ่าน':'รอตรวจ'):'รอตรวจ');if(T[0]==='G1'&&st==='รอตรวจ'&&rnd()<.5)st='รอเอกสาร';
          const n=1+Math.floor(rnd()*3),hue=Math.floor(rnd()*360);
          recs.push({id:t.name+'|'+k+'|'+p+'|'+j,tech:t.name,dateKey:k,hospital:h,code:T[0],label:T[2]===0?'งานอื่นๆ — '+pick(['ติดตั้งจอห้อง OR 3','ย้ายเครื่องไปตึกใหม่','ช่วยงานคลังสินค้า']):T[1],pt:T[2],desc:pick(DESC),note:pick(PROB),
            photos:Array.from({length:n},(_,q)=>photo(T[0]+' รูป '+(q+1),hue+q*25)),status:st,by:st==='ผ่าน'||st==='ไม่ผ่าน'?'หัวหน้าช่าง (ตัวอย่าง)':'',reason:st==='ไม่ผ่าน'?pick(['รูปไม่ตรงงาน','ไม่มีใบเซ็นลูกค้า','ซ้ำกับวันก่อน']):'',lateDays:rnd()<.1?1+Math.floor(rnd()*4):0,ts:k+'T17:'+String(10+Math.floor(rnd()*40))});}}}});
  return recs;
}

// ค่าจุด: นับ 1 จุด ต่อ ช่าง+วัน+รพ. ที่มีงาน (นับอัตโนมัติ ยกเว้น ไม่นับ) · เฉพาะช่าง กทม. และ รพ. ใน กทม.(75)/ปริมณฑล(100)
function pointRows(name){const g={};RECS.filter(r=>r.tech===name&&inMonth(r)&&r.status==='ผ่าน').forEach(r=>{const c=classify(r);if(c.k!=='pt')return;const k=r.dateKey+'|'+r.hospital;if(!g[k])g[k]={dateKey:r.dateKey,hospital:r.hospital,rate:c.rate,z:c.z,recs:[]};g[k].recs.push(r);});return Object.values(g).sort((a,b)=>a.dateKey<b.dateKey?-1:a.dateKey>b.dateKey?1:0);}   // recs = รายงานที่ใช้คิดจุดนั้น
function perDiemRows(name){const g={};RECS.filter(r=>r.tech===name&&inMonth(r)&&r.status==='ผ่าน').forEach(r=>{const c=classify(r);if(c.k!=='pd')return;if(!g[r.dateKey])g[r.dateKey]={dateKey:r.dateKey,provs:[],recs:[]};const x=g[r.dateKey];if(x.provs.indexOf(c.prov)<0)x.provs.push(c.prov);x.recs.push(r);});return Object.values(g).sort((a,b)=>a.dateKey<b.dateKey?-1:1);}   // 1 วัน = 250 ไม่ว่าไปกี่ที่

  const L=otList().sort((a,b)=>a.dateKey<b.dateKey?1:-1),who={},grp={};

  days.forEach(k=>{const it=RECS.filter(r=>r.tech===wkTech&&r.dateKey===k);const dn='วัน'+DOWF[kd(k).getDay()]+'ที่<br>'+thD(k).split(' ').slice(1).join(' ');
    if(!it.length){h+='<tr><td>'+dn+'</td><td colspan="6" style="text-align:center;color:#888">'+([0,6].indexOf(kd(k).getDay())>=0?'วันหยุด':'-')+'</td></tr>';return;}
    const g={},o=[];it.slice().sort((a,b)=>visitKey(a).localeCompare(visitKey(b))||String(a.ts||'').localeCompare(String(b.ts||''))).forEach(r=>{const l=o[o.length-1];if(l!==undefined&&g[l].hos===r.hospital)g[l].push(r);else{const k=o.length;g[k]=[r];g[k].hos=r.hospital;o.push(k);}});   // ไปที่เดิมซ้ำ = แถวใหม่
    o.forEach((gk,gi)=>{const x=g[gk],hn=x.hos;h+='<tr>'+(gi?'':'<td rowspan="'+o.length+'">'+dn+'</td>')+'<td><b>'+esc(hn)+'</b>'+x.map(kpWarn).join('')+'</td><td>'+x.map(r=>esc(r.code+' '+String(r.label||'').split(' — ')[0])).join('<br>')+'</td><td class="det">'+(x.map(r=>r.desc?'- '+esc(r.desc):'').filter(Boolean).join('<br>')||'-')+'</td><td>'+(x.map(r=>r.note?'- '+esc(r.note):'').filter(Boolean).join('<br>')||'-')+'</td><td>'+x.map(r=>badge(r.status)+(r.by?'<div style="font-size:10.5px;color:#777">'+esc(r.by)+'</div>':'')).join('<br>')+'</td><td class="pics">'+(ps=>ps.slice(0,6).map(p=>'<img loading="lazy" referrerpolicy="no-referrer" src="'+p+'">').join('')+(ps.length>6?'<div class="more">+'+(ps.length-6)+' รูป</div>':''))(x.reduce((a,r)=>a.concat(r.photos||[]),[]))+'</td></tr>';});});
  $('#view').innerHTML=h+'</table></div>';
  wkZoom();$('#wTech').onchange=e=>{wkTech=e.target.value;vWeek();};$('#wPrev').onclick=()=>{wkStart=addD(wkStart,-7);vWeek();};$('#wNext').onclick=()=>{wkStart=addD(wkStart,7);vWeek();};
}
function count(){$('#nWait').textContent='';$('#nOt').textContent=RECS.filter(r=>inMonth(r)&&r.code==='K1').length||'';}
function go(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({ov:vOverview,rv:vReview,sc:vScore,ot:vOther,pl:vPlan,pt:vPoint,wk:vWeek})[t]();count();window.scrollTo(0,0);}
// ===== บันทึกผลตรวจเข้าระบบกลาง (เฉพาะข้อมูลจริง) =====
function postRev(id,s,reason){if(!LIVE||sampleOn())return;fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({app:'tech',op:'review',id:id,status:s,by:REVIEWER,reason:reason||''})}).then(r=>r.json()).then(j=>{if(!j.ok)throw 0;}).catch(()=>alert('บันทึกผลตรวจเข้าระบบไม่สำเร็จ — เช็กเน็ตแล้วกดใหม่อีกครั้งนะคะ'));}
function visitKey(r){var m=String(r.desc||r.detail||'').match(/เวลา\s*(\d{1,2})[.:](\d{2})/);if(m)return ('0'+m[1]).slice(-2)+':'+m[2];var t=r.ts||r.savedAt;if(!t)return '99:99';var d=new Date(t);return isNaN(d)?'99:99':('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}   // เวลาไปจริง (จากรายละเอียด) > เวลาที่บันทึก
// ===== start =====
function months(){const s=$('#selMonth');const ms=[...new Set(RECS.map(r=>r.dateKey.slice(0,7)).concat([TODAY.slice(0,7)]))].sort().reverse();
  s.innerHTML=ms.map(m=>'<option value="'+m+'">'+MONF[+m.slice(5)-1]+' '+(+m.slice(0,4)+543)+'</option>').join('');s.value=month;s.onchange=()=>{month=s.value;go(tab);};}
months();
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='rv'&&tab!=='rv'){fStat='ทั้งหมด';}go(b.dataset.t);});
$('#logout').onclick=()=>{try{sessionStorage.removeItem('endo_dash')}catch(e){}location.reload();};
const SYNC_URL=(window.APP_CONFIG&&window.APP_CONFIG.SYNC_URL)||'';let LIVE=false,liveAt=null;
function loadLive(){if(!SYNC_URL||sampleOn())return;LIVE=false;demoBar();const n=new Date(),from=dk(new Date(n.getFullYear(),n.getMonth()-11,1));
  fetch(SYNC_URL+'?op=list&app=tech&from='+from).then(r=>r.json()).then(j=>{if(!j||!j.ok)throw 0;if(sampleOn())return;RECS=j.list.map(o=>({id:o.id,tech:o.tech,dateKey:o.dateKey,hospital:o.hospital,code:o.code,label:o.label,pt:+o.points||0,desc:o.desc||'',note:o.note||'',photos:o.photos||[],status:(!o.status||o.status==='รอตรวจ'||o.status==='รอเอกสาร')?'ผ่าน':o.status,by:(!o.status||o.status==='รอตรวจ'||o.status==='รอเอกสาร')?'อัตโนมัติ':(o.by||''),reason:o.reason||'',at:o.at||'',lateDays:+o.lateDays||0,allow:o.allowanceType||'',area:o.area||'',ts:o.ts||o.savedAt,warn:mkWarn(o,o.dateKey),notes:o.notes||[]}));LIVE=true;kpBellPaint();liveAt=new Date();months();demoBar();go(tab);})
  .catch(()=>{$('#demoBar').innerHTML='⚠️ โหลดรายงานไม่สำเร็จ (เน็ต/ระบบ) · <a href="#" onclick="loadLive();return false">ลองใหม่</a>';});}
const liveBar=()=>LIVE?'🟢 รายงานจริงจากแอปช่าง '+RECS.length+' รายการ · อัปเดต '+String(liveAt.getHours()).padStart(2,'0')+':'+String(liveAt.getMinutes()).padStart(2,'0')+' · <a href="#" onclick="loadLive();return false">โหลดใหม่</a> · <a href="#" id="sampleOn">ดูข้อมูลตัวอย่าง</a>'
  :'⏳ กำลังโหลดรายงานจากแอปช่าง...';
function demoBar(){const on=sampleOn();$('#demoBar').innerHTML=(on?'🧪 กำลังดู<b>ข้อมูลตัวอย่าง</b> (สมมติ) · ผลตรวจจำไว้ในเครื่องนี้ · <a href="#" id="resetDemo">ล้างผลตรวจ</a> · <a href="#" id="sampleOff">ปิดข้อมูลตัวอย่าง</a>'
  :SYNC_URL?liveBar():'📭 ยังไม่มีรายงาน — เมื่อต่อระบบจริง รายงานจากแอปช่างจะขึ้นที่นี่ · <a href="#" id="sampleOn">ดูข้อมูลตัวอย่าง</a>');
  const a=$('#sampleOn'),b=$('#sampleOff'),c=$('#resetDemo');
  if(a)a.onclick=e=>{e.preventDefault();try{localStorage.setItem(SKEY,'1')}catch(x){}seed=7;RECS=buildDemo();applyRev();months();demoBar();go(tab);};
  if(b)b.onclick=e=>{e.preventDefault();try{localStorage.removeItem(SKEY)}catch(x){}RECS=[];months();demoBar();go(tab);loadLive();};
  if(c)c.onclick=e=>{e.preventDefault();try{localStorage.removeItem(KEY)}catch(x){}seed=7;RECS=buildDemo();go(tab);};}
function enter(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent='ผู้ตรวจ: '+REVIEWER;demoBar();go('ov');loadLive();}
(function(){let v='';try{v=localStorage.getItem('endo_dash_reviewer')||''}catch(e){}const q=new URLSearchParams(location.search).get('rv');if(q==='kosie')v='คุณโกสีห์ (KOSIE)';const sel=$('#rvSel');   // ?rv=kosie = ลิงก์จากแอป KOSIE เลือกชื่อให้
  if(v){if([...sel.options].some(o=>o.value===v))sel.value=v;else{sel.value='__other';$('#rvName').classList.remove('hidden');$('#rvName').value=v;}}
  sel.onchange=()=>{$('#rvName').classList.toggle('hidden',sel.value!=='__other');if(sel.value==='__other')$('#rvName').focus();};})();
$('#pwGo').onclick=()=>{const sv=$('#rvSel').value,nm=(sv==='__other'?$('#rvName').value:sv).trim();if(!nm){$('#pwErr').textContent='ใส่ชื่อผู้ตรวจก่อนนะคะ';$('#rvName').focus();return;}REVIEWER=nm;try{localStorage.setItem('endo_dash_reviewer',nm)}catch(e){}
  if($('#pw').value===PASS){try{sessionStorage.setItem('endo_dash','1')}catch(e){}enter();}else $('#pwErr').textContent='รหัสไม่ถูกต้อง';};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#pwGo').click();};
/* ===== เปิดจากแอป KOSIE (ลิงก์เดียวกับอนุมัติใบส้ม) — ?kosie=<โทเคน> เข้าได้เลย ไม่ต้องใส่ชื่อ/รหัส · เก็บแค่ค่า hash ในโค้ด ===== */
const KOSIE_H='d935041312d7ea4e6ecc8482eb389194ebfc551fbcef84725f4b80f9257f0dd1';
(async()=>{try{const t=new URLSearchParams(location.search).get('kosie');
  if(t&&crypto.subtle){const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
    if(h===KOSIE_H){REVIEWER='คุณโกสีห์ (KOSIE)';KP=true;try{sessionStorage.setItem('endo_dash','1');sessionStorage.setItem('kp','1')}catch(e){}enter();return;}}
  if(sessionStorage.getItem('endo_dash')==='1')enter();}catch(e){}})();
</script>
