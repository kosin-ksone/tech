<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รูปรายงานช่าง</title>
<!-- หน้าดูรูปรายงานช่าง (ลิงก์จากไฟล์ "รายงานช่าง (KOSIE)") · รูปเรียงแนวยาว เลื่อนเมาส์ดู · คลิกจุดไหนซูมจุดนั้นเรื่อยๆ · KOSIE ขอ 3 พ.ย. 69 -->
<style>
:root{--bg:#14171c;--card:#1f242c;--txt:#eef1f5;--mut:#9aa4b2;--gold:#C9A24A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0B1F4D;border-bottom:2px solid var(--gold);padding:10px 16px}
header b{font-size:16px}
header div{font-size:13px;color:#c9d3e6;margin-top:2px}
.help{font-size:12.5px;color:var(--mut);text-align:center;padding:10px 16px 0}
main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.ph{position:relative;margin:0 0 18px;background:var(--card);border-radius:10px;overflow:hidden}
.box{overflow:hidden;cursor:zoom-in}
.box.zoomed{cursor:grab}
.box.drag{cursor:grabbing}
.box img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.cap{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;color:var(--mut)}
.cap span{flex:1}
.cap button{border:1px solid #3a4250;background:#2a3039;color:var(--txt);border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.cap button[hidden]{display:none}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.ver{text-align:center;font-size:11px;color:#666;margin-top:10px}
</style>
</head>
<body>
<header><b id="ttl">รูปรายงานช่าง</b><div id="sub"></div></header>
<div class="help">เลื่อนเมาส์เพื่อดูรูปถัดไป · คลิกจุดที่อยากดู = ซูมเข้าตรงนั้น (คลิกซ้ำซูมเพิ่ม) · ลากเพื่อเลื่อนดูส่วนอื่น · คลิกขวา = ย่อกลับทีละขั้น</div>
<main id="list"></main>
<div class="ver">หน้าดูรูป v1.0 · 3 พ.ย. 69 · Developed by KOSIN</div>
<script>
var q = new URLSearchParams(location.hash.slice(1));
var ids = (q.get('ids') || '').split(',').filter(function (x) { return /^[\w-]{10,}$/.test(x); });
document.getElementById('ttl').textContent = q.get('t') || 'รูปรายงานช่าง';
document.getElementById('sub').textContent = (q.get('s') || '') + (ids.length ? (q.get('s') ? ' · ' : '') + ids.length + ' รูป' : '');
if (q.get('t')) document.title = q.get('t');
var list = document.getElementById('list');
if (!ids.length) list.innerHTML = '<div class="empty">รายงานนี้ไม่มีรูป</div>';
var MAX = 8;
ids.forEach(function (id, i) {
  var ph = document.createElement('div'); ph.className = 'ph';
  ph.innerHTML = '<div class="box"><img loading="lazy" alt="รูป ' + (i + 1) + '" src="https://lh3.googleusercontent.com/d/' + id + '=w2400"></div>' +
    '<div class="cap"><span>รูป ' + (i + 1) + ' / ' + ids.length + ' <b class="zl"></b></span><button class="rs" hidden>↺ ขนาดเดิม</button><a href="https://drive.google.com/file/d/' + id + '/view" target="_blank" style="color:#9fb7e6;font-size:12px">เปิดไฟล์</a></div>';
  list.appendChild(ph);
  setup(ph);
});
function setup(ph) {
  var box = ph.querySelector('.box'), img = ph.querySelector('img'), z = 1, down = null, moved = false;
  // ซูมโดยให้จุด (cx,cy บนจอ) ยังอยู่ที่เดิม
  function zoomTo(nz, cx, cy) {
    nz = Math.max(1, Math.min(MAX, nz)); if (nz === z) return;
    var r = img.getBoundingClientRect(), fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
    z = nz; img.style.width = (z * 100) + '%';
    var nr = img.getBoundingClientRect();
    box.scrollLeft += (nr.left + fx * nr.width) - cx;
    window.scrollBy(0, (nr.top + fy * nr.height) - cy);
    box.classList.toggle('zoomed', z > 1);
    ph.querySelector('.rs').hidden = z === 1;
    ph.querySelector('.zl').textContent = z > 1 ? '· ซูม ' + z + ' เท่า' : '';
  }
  box.addEventListener('mousedown', function (e) { if (e.button) return; down = { x: e.clientX, y: e.clientY, sl: box.scrollLeft, sy: window.scrollY }; moved = false; e.preventDefault(); });
  window.addEventListener('mousemove', function (e) {
    if (!down) return;
    var dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    moved = true; box.classList.add('drag');
    if (z > 1) { box.scrollLeft = down.sl - dx; window.scrollTo(0, down.sy - dy); }
  });
  window.addEventListener('mouseup', function (e) {
    if (!down) return; var wasMoved = moved; down = null; box.classList.remove('drag');
    if (!wasMoved && e.button === 0) zoomTo(z * 2, e.clientX, e.clientY);
  });
  box.addEventListener('contextmenu', function (e) { e.preventDefault(); zoomTo(z / 2, e.clientX, e.clientY); });
  ph.querySelector('.rs').onclick = function () { var r = img.getBoundingClientRect(); zoomTo(1, r.left + r.width / 2, Math.max(r.top, 0) + 10); ph.scrollIntoView({ block: 'start' }); window.scrollBy(0, -60); };
  // มือถือ: แตะ = ซูม (ลากใช้การเลื่อนปกติของเครื่อง)
  box.addEventListener('touchend', function (e) { if (e.changedTouches.length !== 1 || box.dataset.tmove) { box.dataset.tmove = ''; return; } var t = e.changedTouches[0]; e.preventDefault(); zoomTo(z * 2 > MAX ? 1 : z * 2, t.clientX, t.clientY); });
  box.addEventListener('touchmove', function () { box.dataset.tmove = '1'; }, { passive: true });
}
</script>
</body>
</html>
